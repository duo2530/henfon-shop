spring:
  config:
    activate:
      on-profile: dev
  mail:
    # SMTP 邮件服务配置，用于找回密码和业务通知；账号、授权码建议通过环境变量覆盖。
    host: ${SHOP_MAIL_HOST:smtp.163.com}
    port: ${SHOP_MAIL_PORT:25}
    username: ${SHOP_MAIL_USERNAME:}
    password: ${SHOP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SHOP_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SHOP_MAIL_SMTP_STARTTLS:true}
  datasource:
    # MySQL 数据源。开发环境默认连接本机 henfon-shop，连接信息可通过环境变量覆盖。
    url: ${SHOP_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/henfon-shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHOP_MYSQL_USERNAME:root}
    password: ${SHOP_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # HikariCP 连接池参数：空闲连接、最大连接数和连接池名称。
      pool-name: shop-hikari-dev
      minimum-idle: 5
      maximum-pool-size: 20
      initialization-fail-timeout: -1
  data:
    redis:
      # Redis 用于 JWT 刷新令牌、黑名单和缓存；database 表示 Redis 逻辑库编号。
      host: ${SHOP_REDIS_HOST:127.0.0.1}
      port: ${SHOP_REDIS_PORT:6379}
      # 当前本机 Redis 使用密码认证，不发送 ACL 用户名。
      username: ${SHOP_REDIS_USERNAME:}
      password: ${SHOP_REDIS_PASSWORD:123456}
      database: ${SHOP_REDIS_DATABASE:0}
      timeout: ${SHOP_REDIS_TIMEOUT:3s}

rocketmq:
  # RocketMQ 只承担跨模块异步解耦，当前仍是单体部署。
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:shop-admin-dev-producer}
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:3000}
    retry-times-when-send-failed: ${ROCKETMQ_RETRY_TIMES:2}

shop:
  rocketmq:
    # RocketMQ 启动后改为 true，即可一次性开启全部消费监听器。
    consumer-enabled: ${SHOP_ROCKETMQ_CONSUMER_ENABLED:false}
  inventory:
    # 库存过期预占扫描任务：释放超时未支付订单的锁定库存。
    expire-scan-ms: ${SHOP_INVENTORY_EXPIRE_SCAN_MS:60000}
    expire-initial-delay-ms: ${SHOP_INVENTORY_EXPIRE_INITIAL_DELAY_MS:30000}
  trade:
    # 订单超时关闭与 Outbox 发布均采用可配置扫描周期，开发环境保持较短周期便于联调。
    order-payment-timeout-minutes: ${SHOP_ORDER_PAYMENT_TIMEOUT_MINUTES:30}
    order-timeout-scan-ms: ${SHOP_ORDER_TIMEOUT_SCAN_MS:60000}
    order-timeout-initial-delay-ms: ${SHOP_ORDER_TIMEOUT_INITIAL_DELAY_MS:15000}
    outbox-scan-ms: ${SHOP_OUTBOX_SCAN_MS:5000}
    outbox-initial-delay-ms: ${SHOP_OUTBOX_INITIAL_DELAY_MS:10000}
    logistics-sync-scan-ms: ${SHOP_LOGISTICS_SYNC_SCAN_MS:600000}
    logistics-sync-initial-delay-ms: ${SHOP_LOGISTICS_SYNC_INITIAL_DELAY_MS:30000}
  marketing:
    # 秒杀活动预热与过期收口扫描配置。
    flash-sale-warmup-scan-ms: ${SHOP_FLASH_SALE_WARMUP_SCAN_MS:60000}
    flash-sale-warmup-initial-delay-ms: ${SHOP_FLASH_SALE_WARMUP_INITIAL_DELAY_MS:15000}
    flash-sale-warmup-minutes: ${SHOP_FLASH_SALE_WARMUP_MINUTES:30}
    # 门户秒杀与下单接口限流，默认关闭，本地联调不受影响。
    flash-sale-rate-limit-enabled: ${SHOP_FLASH_SALE_RATE_LIMIT_ENABLED:false}
    flash-sale-rate-limit-limit: ${SHOP_FLASH_SALE_RATE_LIMIT_LIMIT:120}
    flash-sale-rate-limit-window-seconds: ${SHOP_FLASH_SALE_RATE_LIMIT_WINDOW_SECONDS:60}
  notification:
    email:
      # 站内事件邮件通知开关及发件人信息；关闭后仍保留站内通知。
      enabled: ${SHOP_EMAIL_NOTIFICATION_ENABLED:true}
      from: ${SHOP_EMAIL_FROM:13070274245@163.com}
      subject-prefix: ${SHOP_EMAIL_SUBJECT_PREFIX:Henfon商城}
  integration:
    logistics:
      kuaidi100:
        # 开发环境已配置快递100测试账号；生产环境仍通过部署平台注入环境变量。
        enabled: ${SHOP_KUAIDI100_ENABLED:true}
        customer: ${SHOP_KUAIDI100_CUSTOMER:}
        key: ${SHOP_KUAIDI100_KEY:}
        query-url: ${SHOP_KUAIDI100_QUERY_URL:https://poll.kuaidi100.com/poll/query.do}
        connect-timeout-ms: ${SHOP_KUAIDI100_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${SHOP_KUAIDI100_READ_TIMEOUT_MS:10000}
      alert:
        enabled: ${SHOP_LOGISTICS_ALERT_ENABLED:false}
        webhook-url: ${SHOP_LOGISTICS_ALERT_WEBHOOK_URL:}
        connect-timeout-ms: ${SHOP_LOGISTICS_ALERT_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${SHOP_LOGISTICS_ALERT_READ_TIMEOUT_MS:3000}
  payment:
    # 支付单过期扫描任务：关闭超时未支付单并联动释放订单库存。
    # 支付单过期扫描周期，支付适配器接入后可按渠道接口时限调整。
    expire-scan-ms: ${SHOP_PAYMENT_EXPIRE_SCAN_MS:60000}
    expire-initial-delay-ms: ${SHOP_PAYMENT_EXPIRE_INITIAL_DELAY_MS:20000}
    # 微信支付 V3 配置。开发环境默认启用 Native 扫码支付；生产环境请改用环境变量注入敏感字段。
    wechat:
      # ==================== 微信支付 V3 配置说明 ====================
      # 这里使用“环境变量:默认值”的写法，例如：
      #   enabled: ${SHOP_WECHAT_PAY_ENABLED:false}
      # 启动应用时如果没有设置环境变量，就会使用冒号后面的默认值。
      # 当前已填入开发联调参数并开启；如果暂时不想调用微信接口，可改为 false。
      #
      # enabled：是否启用微信支付。false=关闭，true=启用真实支付。
      enabled: ${SHOP_WECHAT_PAY_ENABLED:true}
      # mode：支付场景。NATIVE=网页展示二维码；H5=手机浏览器跳转微信；JSAPI=微信内置浏览器支付。
      # shop-portal 当前优先按 NATIVE 扫码支付设计，暂时不要填写小写或中文。
      mode: ${SHOP_WECHAT_PAY_MODE:NATIVE}
      # app-id：微信公众平台/小程序的 AppID，格式类似 wx1234567890abcdef。
      # NATIVE、JSAPI 通常需要填写；如果使用 H5，请按商户平台实际要求填写绑定的 AppID。
      app-id: ${SHOP_WECHAT_PAY_APP_ID:}
      # merchant-id：微信支付商户号（mchid），通常是 10 位数字，不是 AppID。
      merchant-id: ${SHOP_WECHAT_PAY_MERCHANT_ID:}
      # merchant-serial-number：商户 API 证书序列号。
      # 可在微信商户平台“账户中心 -> API安全 -> 商户API证书”中查看。
      merchant-serial-number: ${SHOP_WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      # api-v3-key：微信支付 API v3 密钥，必须是 32 位字符；不要填写 API 密钥或登录密码。
      # 该值属于敏感信息，只通过环境变量或部署平台密钥管理注入，不要提交到 Git。
      api-v3-key: ${SHOP_WECHAT_PAY_API_V3_KEY:}
      # merchant-private-key-path：商户私钥 apiclient_key.pem 的绝对路径。
      # Windows 示例：D:/secure/wechat/apiclient_key.pem；Linux 示例：/etc/henfon/wechat/apiclient_key.pem。
      merchant-private-key-path: ${SHOP_WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:D:/wx-pay/apiclient_key.pem}
      # platform-certificate-path：传统平台证书验签模式使用的 wechatpay_*.pem 绝对路径。
      # 本次你提供的是“平台公钥”，所以该项暂时留空；如果后续切换为平台证书验签，再填写此路径。
      platform-certificate-path: ${SHOP_WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
      # 微信支付平台公钥模式使用的公钥 ID；平台证书路径为空时将使用该公钥验签。
      public-key-id: ${SHOP_WECHAT_PAY_PUBLIC_KEY_ID:}
      # 微信支付平台公钥文件路径。你提供的是 D:/wx-pay/pub_key.pem。
      public-key-path: ${SHOP_WECHAT_PAY_PUBLIC_KEY_PATH:D:/wx-pay/pub_key.pem}
      # notify-url：支付成功后的微信 V3 原始通知地址，必须是微信服务器可访问的公网 HTTPS 地址。
      # 必须使用 /api/wx/pay/notify/v3（包含请求头验签和 AES-GCM 解密），不能填写旧 DTO 入口或 localhost。
      notify-url: ${SHOP_WECHAT_PAY_NOTIFY_URL:https://37f8040f.r23.cpolar.top/api/wx/pay/notify/v3}
      # refund-notify-url：退款结果的微信 V3 原始通知地址，同样必须是公网 HTTPS 地址。
      # 必须使用 /api/wx/pay/refund/notify/v3，并在微信商户平台配置相同地址。
      refund-notify-url: ${SHOP_WECHAT_PAY_REFUND_NOTIFY_URL:https://37f8040f.r23.cpolar.top/api/wx/pay/refund/notify/v3}
      # api-base-url：微信支付接口地址，正式环境保持默认值即可，一般不需要修改。
      api-base-url: ${SHOP_WECHAT_PAY_API_BASE_URL:https://api.mch.weixin.qq.com}
      # connect-timeout/read-timeout：连接微信接口和读取响应的超时时间，使用 Spring 时长格式；超时会返回支付失败并允许重试。
      connect-timeout: ${SHOP_WECHAT_PAY_CONNECT_TIMEOUT:3s}
      read-timeout: ${SHOP_WECHAT_PAY_READ_TIMEOUT:10s}
  security:
    member-password-reset:
      # 会员找回密码链接地址及有效期、发送冷却时间。
      url: ${SHOP_MEMBER_PASSWORD_RESET_URL:http://localhost:3000/}
      ttl-minutes: ${SHOP_MEMBER_PASSWORD_RESET_TTL_MINUTES:15}
      cooldown-seconds: ${SHOP_MEMBER_PASSWORD_RESET_COOLDOWN_SECONDS:60}
    jwt:
      # JWT 签发参数；secret 仅用于本地开发，生产环境必须替换为随机长密钥。
      secret: ${SHOP_JWT_SECRET:henfon-shop-jwt-secret-key-change-in-production-2026}
      expiration-seconds: ${SHOP_JWT_EXPIRATION_SECONDS:28800}
      issuer: ${SHOP_JWT_ISSUER:henfon-shop}
  storage:
    minio:
      # MinIO 对象存储，用于商品媒体、评价凭证等文件；endpoint 必须能被后端访问。
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:shop}
mybatis-plus:
  configuration:
    # 开发环境输出 SQL，便于接口联调；生产环境由 application-prod.yml 关闭。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.henfon.shop: ${SHOP_LOG_LEVEL:DEBUG}
    org.springframework.web: ${SHOP_WEB_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: always
