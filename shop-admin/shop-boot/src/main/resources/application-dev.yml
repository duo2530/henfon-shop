spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 开发环境默认连接本机 henfon-shop，连接信息可通过环境变量覆盖。
    url: ${SHOP_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/henfon-shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHOP_MYSQL_USERNAME:root}
    password: ${SHOP_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: shop-hikari-dev
      minimum-idle: 5
      maximum-pool-size: 20
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${SHOP_REDIS_HOST:127.0.0.1}
      port: ${SHOP_REDIS_PORT:6379}
      # 当前本机 Redis 使用密码认证，不发送 ACL 用户名。
      username: ${SHOP_REDIS_USERNAME:}
      password: ${SHOP_REDIS_PASSWORD:123456}
      database: ${SHOP_REDIS_DATABASE:0}
      timeout: ${SHOP_REDIS_TIMEOUT:3s}

rocketmq:
  # RocketMQ 只承担跨模块异步解耦，当前仍是单体部署。
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:shop-admin-dev-producer}
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:3000}
    retry-times-when-send-failed: ${ROCKETMQ_RETRY_TIMES:2}

shop:
  security:
    jwt:
      secret: ${SHOP_JWT_SECRET:henfon-shop-jwt-secret-key-change-in-production-2026}
      expiration-seconds: ${SHOP_JWT_EXPIRATION_SECONDS:28800}
      issuer: ${SHOP_JWT_ISSUER:henfon-shop}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:shop}

mybatis-plus:
  configuration:
    # 开发环境输出 SQL，便于接口联调；生产环境由 application-prod.yml 关闭。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.henfon.shop: ${SHOP_LOG_LEVEL:DEBUG}
    org.springframework.web: ${SHOP_WEB_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: always
