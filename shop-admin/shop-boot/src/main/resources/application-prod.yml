spring:
  config:
    activate:
      on-profile: prod
  mail:
    # 生产环境通过部署平台注入 SMTP 账号，默认不开启业务邮件。
    host: ${SHOP_MAIL_HOST:}
    port: ${SHOP_MAIL_PORT:587}
    username: ${SHOP_MAIL_USERNAME:}
    password: ${SHOP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SHOP_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SHOP_MAIL_SMTP_STARTTLS:true}
  datasource:
    # 生产环境不提供默认连接信息，必须通过部署平台注入环境变量。
    url: ${SHOP_MYSQL_URL}
    username: ${SHOP_MYSQL_USERNAME}
    password: ${SHOP_MYSQL_PASSWORD}
    hikari:
      minimum-idle: ${SHOP_MYSQL_POOL_MIN:10}
      maximum-pool-size: ${SHOP_MYSQL_POOL_MAX:50}
      connection-timeout: ${SHOP_MYSQL_CONNECTION_TIMEOUT:3000}
  data:
    redis:
      host: ${SHOP_REDIS_HOST}
      port: ${SHOP_REDIS_PORT:6379}
      username: ${SHOP_REDIS_USERNAME:}
      password: ${SHOP_REDIS_PASSWORD}
      database: ${SHOP_REDIS_DATABASE:0}
      timeout: ${SHOP_REDIS_TIMEOUT:3s}

mybatis-plus:
  configuration:
    # 生产环境不输出 SQL 和参数，避免日志泄露敏感数据。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

rocketmq:
  # 未显式注入时使用本机开发 NameServer，避免空环境变量导致客户端以 null 地址启动。
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:shop-admin-prod-producer}
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:5000}
    retry-times-when-send-failed: ${ROCKETMQ_RETRY_TIMES:3}

shop:
  trade:
    order-payment-timeout-minutes: ${SHOP_ORDER_PAYMENT_TIMEOUT_MINUTES:30}
    order-timeout-scan-ms: ${SHOP_ORDER_TIMEOUT_SCAN_MS:60000}
    order-timeout-initial-delay-ms: ${SHOP_ORDER_TIMEOUT_INITIAL_DELAY_MS:15000}
    outbox-scan-ms: ${SHOP_OUTBOX_SCAN_MS:5000}
    outbox-initial-delay-ms: ${SHOP_OUTBOX_INITIAL_DELAY_MS:10000}
    logistics-sync-scan-ms: ${SHOP_LOGISTICS_SYNC_SCAN_MS:600000}
    logistics-sync-initial-delay-ms: ${SHOP_LOGISTICS_SYNC_INITIAL_DELAY_MS:30000}
  marketing:
    flash-sale-warmup-scan-ms: ${SHOP_FLASH_SALE_WARMUP_SCAN_MS:60000}
    flash-sale-warmup-initial-delay-ms: ${SHOP_FLASH_SALE_WARMUP_INITIAL_DELAY_MS:15000}
    flash-sale-warmup-minutes: ${SHOP_FLASH_SALE_WARMUP_MINUTES:30}
  notification:
    email:
      enabled: ${SHOP_EMAIL_NOTIFICATION_ENABLED:false}
      from: ${SHOP_EMAIL_FROM:}
      subject-prefix: ${SHOP_EMAIL_SUBJECT_PREFIX:Henfon商城}
  integration:
    logistics:
      kuaidi100:
        # 生产环境必须由部署平台注入密钥，禁止把客户号和密钥写入仓库。
        enabled: ${SHOP_KUAIDI100_ENABLED:false}
        customer: ${SHOP_KUAIDI100_CUSTOMER:}
        key: ${SHOP_KUAIDI100_KEY:}
        query-url: ${SHOP_KUAIDI100_QUERY_URL:https://poll.kuaidi100.com/poll/query.do}
        connect-timeout-ms: ${SHOP_KUAIDI100_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${SHOP_KUAIDI100_READ_TIMEOUT_MS:10000}
  payment:
    invoice:
      # 开票平台异步回调鉴权令牌，由部署平台注入，禁止写入代码仓库。
      callback-token: ${SHOP_INVOICE_CALLBACK_TOKEN:}
    wechat:
      # ==================== 微信支付 V3 生产环境配置 ====================
      # 生产环境不提供敏感信息默认值，建议通过容器、系统服务或部署平台注入以下环境变量。
      # enabled：确认所有证书、密钥和公网 HTTPS 回调已配置后，才改为 true。
      enabled: ${SHOP_WECHAT_PAY_ENABLED:false}
      # mode：NATIVE=二维码支付；H5=手机浏览器支付；JSAPI=微信内置浏览器支付。
      mode: ${SHOP_WECHAT_PAY_MODE:NATIVE}
      # app-id：生产公众号/小程序 AppID，例如 wx1234567890abcdef。
      app-id: ${SHOP_WECHAT_PAY_APP_ID:}
      # merchant-id：生产微信支付商户号（mchid）。
      merchant-id: ${SHOP_WECHAT_PAY_MERCHANT_ID:}
      # merchant-serial-number：生产商户 API 证书序列号。
      merchant-serial-number: ${SHOP_WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      # api-v3-key：生产 API v3 密钥，必须 32 位；严禁提交到代码仓库或写入日志。
      api-v3-key: ${SHOP_WECHAT_PAY_API_V3_KEY:}
      # merchant-private-key-path：生产商户私钥 apiclient_key.pem 的绝对路径。
      merchant-private-key-path: ${SHOP_WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
      # platform-certificate-path：生产微信支付平台证书 wechatpay_*.pem 的绝对路径。
      platform-certificate-path: ${SHOP_WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
      # public-key-id/public-key-path：平台公钥验签模式的公钥 ID 和 PEM 路径；配置后可替代平台证书。
      public-key-id: ${SHOP_WECHAT_PAY_PUBLIC_KEY_ID:}
      public-key-path: ${SHOP_WECHAT_PAY_PUBLIC_KEY_PATH:}
      # notify-url：生产支付异步通知公网 HTTPS 地址，必须在商户平台配置并与此值一致。
      notify-url: ${SHOP_WECHAT_PAY_NOTIFY_URL:}
      # refund-notify-url：生产退款异步通知公网 HTTPS 地址。
      refund-notify-url: ${SHOP_WECHAT_PAY_REFUND_NOTIFY_URL:}
      # api-base-url：正式微信支付接口地址，通常保持默认值。
      api-base-url: ${SHOP_WECHAT_PAY_API_BASE_URL:https://api.mch.weixin.qq.com}
      # 超时时间使用 Spring 时长格式，可按网络情况调整，默认连接 3 秒、读取 10 秒。
      connect-timeout: ${SHOP_WECHAT_PAY_CONNECT_TIMEOUT:3s}
      read-timeout: ${SHOP_WECHAT_PAY_READ_TIMEOUT:10s}
  security:
    member-password-reset:
      url: ${SHOP_MEMBER_PASSWORD_RESET_URL:}
      ttl-minutes: ${SHOP_MEMBER_PASSWORD_RESET_TTL_MINUTES:15}
      cooldown-seconds: ${SHOP_MEMBER_PASSWORD_RESET_COOLDOWN_SECONDS:60}
    jwt:
      # 生产环境必须使用长度足够且定期轮换的密钥。
      secret: ${SHOP_JWT_SECRET}
      expiration-seconds: ${SHOP_JWT_EXPIRATION_SECONDS:7200}
      issuer: ${SHOP_JWT_ISSUER:henfon-shop}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:shop}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${SHOP_ROOT_LOG_LEVEL:INFO}
    com.henfon.shop: ${SHOP_LOG_LEVEL:INFO}
