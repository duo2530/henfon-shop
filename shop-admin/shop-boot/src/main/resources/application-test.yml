spring:
  config:
    activate:
      on-profile: test
  datasource:
    # 测试环境默认使用独立库，避免测试数据污染开发库；执行测试前请创建该数据库或覆盖连接串。
    url: ${SHOP_TEST_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/henfon-shop-test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHOP_TEST_MYSQL_USERNAME:root}
    password: ${SHOP_TEST_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: shop-hikari-test
      minimum-idle: 1
      maximum-pool-size: 5
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${SHOP_TEST_REDIS_HOST:127.0.0.1}
      port: ${SHOP_TEST_REDIS_PORT:6379}
      username: ${SHOP_TEST_REDIS_USERNAME:}
      password: ${SHOP_TEST_REDIS_PASSWORD:123456}
      database: ${SHOP_TEST_REDIS_DATABASE:1}
      timeout: ${SHOP_TEST_REDIS_TIMEOUT:3s}

rocketmq:
  # 测试环境使用独立生产者组，避免消费/发送标识与开发环境混用。
  name-server: ${SHOP_TEST_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${SHOP_TEST_ROCKETMQ_PRODUCER_GROUP:shop-admin-test-producer}

shop:
  trade:
    order-payment-timeout-minutes: ${SHOP_TEST_ORDER_PAYMENT_TIMEOUT_MINUTES:30}
    order-timeout-scan-ms: ${SHOP_TEST_ORDER_TIMEOUT_SCAN_MS:60000}
    order-timeout-initial-delay-ms: ${SHOP_TEST_ORDER_TIMEOUT_INITIAL_DELAY_MS:15000}
    outbox-scan-ms: ${SHOP_TEST_OUTBOX_SCAN_MS:5000}
    outbox-initial-delay-ms: ${SHOP_TEST_OUTBOX_INITIAL_DELAY_MS:10000}
  payment:
    wechat:
      # ==================== 微信支付 V3 测试环境配置 ====================
      # 测试环境变量统一使用 SHOP_TEST_WECHAT_PAY_ 前缀，避免误用开发或生产配置。
      # enabled：是否启用支付。默认 false；联调前请确认使用的商户号和回调地址属于测试环境。
      enabled: ${SHOP_TEST_WECHAT_PAY_ENABLED:false}
      # mode：NATIVE=二维码支付，H5=手机网页支付，JSAPI=微信内支付；当前默认 NATIVE。
      mode: ${SHOP_TEST_WECHAT_PAY_MODE:NATIVE}
      # app-id：微信公众平台/小程序 AppID，例如 wx1234567890abcdef。
      app-id: ${SHOP_TEST_WECHAT_PAY_APP_ID:}
      # merchant-id：微信支付商户号（mchid），在商户平台账户中心查看。
      merchant-id: ${SHOP_TEST_WECHAT_PAY_MERCHANT_ID:}
      # merchant-serial-number：商户 API 证书序列号，在“API安全 -> 商户API证书”查看。
      merchant-serial-number: ${SHOP_TEST_WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      # api-v3-key：32 位 API v3 密钥，不是商户登录密码；请通过环境变量注入。
      api-v3-key: ${SHOP_TEST_WECHAT_PAY_API_V3_KEY:}
      # merchant-private-key-path：商户私钥 apiclient_key.pem 的绝对路径。
      merchant-private-key-path: ${SHOP_TEST_WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
      # platform-certificate-path：微信支付平台证书 wechatpay_*.pem 的绝对路径。
      platform-certificate-path: ${SHOP_TEST_WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
      # public-key-id/public-key-path：平台公钥验签模式的公钥 ID 和 PEM 路径；配置后可替代平台证书。
      public-key-id: ${SHOP_TEST_WECHAT_PAY_PUBLIC_KEY_ID:}
      public-key-path: ${SHOP_TEST_WECHAT_PAY_PUBLIC_KEY_PATH:}
      # notify-url：支付异步通知公网 HTTPS 地址，不能使用 localhost。
      notify-url: ${SHOP_TEST_WECHAT_PAY_NOTIFY_URL:}
      # refund-notify-url：退款异步通知公网 HTTPS 地址。
      refund-notify-url: ${SHOP_TEST_WECHAT_PAY_REFUND_NOTIFY_URL:}
      # api-base-url：微信支付 API 地址，默认正式接口地址；如有专用网关才需要修改。
      api-base-url: ${SHOP_TEST_WECHAT_PAY_API_BASE_URL:https://api.mch.weixin.qq.com}
      # 超时时间使用 Spring 时长格式，例如 3s、10s。
      connect-timeout: ${SHOP_TEST_WECHAT_PAY_CONNECT_TIMEOUT:3s}
      read-timeout: ${SHOP_TEST_WECHAT_PAY_READ_TIMEOUT:10s}
  security:
    jwt:
      secret: ${SHOP_TEST_JWT_SECRET:henfon-shop-test-jwt-secret-key-change-me-2026}
      expiration-seconds: ${SHOP_TEST_JWT_EXPIRATION_SECONDS:3600}
      issuer: ${SHOP_TEST_JWT_ISSUER:henfon-shop-test}
  storage:
    minio:
      endpoint: ${SHOP_TEST_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${SHOP_TEST_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${SHOP_TEST_MINIO_SECRET_KEY:minioadmin}
      bucket: ${SHOP_TEST_MINIO_BUCKET:shop-test}

logging:
  level:
    com.henfon.shop: ${SHOP_TEST_LOG_LEVEL:INFO}
    org.springframework.web: WARN

management:
  endpoint:
    health:
      show-details: always
