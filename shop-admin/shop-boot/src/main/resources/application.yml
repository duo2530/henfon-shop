server:
  port: ${SHOP_SERVER_PORT:8080}
  servlet:
    context-path: ${SHOP_CONTEXT_PATH:/}

spring:
  profiles:
    # 未显式指定 SPRING_PROFILES_ACTIVE 时默认使用开发环境配置。
    default: dev
  application:
    name: shop-admin
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: ${SHOP_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${SHOP_UPLOAD_MAX_REQUEST_SIZE:50MB}
  task:
    scheduling:
      # 超时关单与 Outbox 投递并行执行，避免 RocketMQ 重试阻塞订单扫描。
      pool:
        size: ${SHOP_SCHEDULING_POOL_SIZE:2}
      thread-name-prefix: shop-scheduler-

# 数据库、Redis、RocketMQ、JWT 和 MinIO 等环境相关配置统一放在 application-{profile}.yml。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.henfon.shop
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
