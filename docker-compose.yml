services:
  shop-admin:
    build:
      context: ./shop-admin
      dockerfile: Dockerfile
    image: henfon/shop-admin:local
    restart: unless-stopped
    ports:
      - "${SHOP_SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SHOP_MYSQL_URL: jdbc:mysql://mysql:3306/henfon-shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SHOP_REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-host.docker.internal:9876}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: henfon-shop
      MYSQL_ROOT_PASSWORD: ${SHOP_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 SHOP_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${SHOP_MYSQL_USERNAME:-henfon}
      MYSQL_PASSWORD: ${SHOP_MYSQL_PASSWORD:?请在 .env 中设置 SHOP_MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 只挂结构基线这一个文件。db/init 是逐版增量脚本，按目录挂进去会从 001 顺序执行，
      # 而 045/046 用了 MariaDB 专有的 ADD COLUMN IF NOT EXISTS，MySQL 8.4 解析不了，
      # 执行到 045 就停下，后面 14 个脚本（含全部 AI 表）都不会跑，建出来的是缺列的库。
      - ./shop-admin/db/schema/henfon-shop.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SHOP_REDIS_PASSWORD:?请在 .env 中设置 SHOP_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # RocketMQ NameServer/Broker 为订单 Outbox、通知和报表事件提供本地消息基础设施。
  # Broker 对外公布 host.docker.internal，保证宿主机启动的 Spring Boot 也能访问消息服务。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh -c "echo 'brokerIP1=host.docker.internal' > /home/rocketmq/rocketmq-5.3.1/conf/broker.conf && sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq-store:/home/rocketmq/store

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-store:
